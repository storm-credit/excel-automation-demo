name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build CLI executable
        run: pyinstaller --noconfirm --onefile --name excel-validator-cli src/validate_excel.py

      - name: Build GUI executable
        run: pyinstaller --noconfirm --onefile --windowed --name excel-validator-gui --paths . src/gui.py

      - name: Smoke test CLI executable
        run: .\dist\excel-validator-cli.exe --help

      - name: Smoke test GUI executable
        shell: powershell
        run: |
          $process = Start-Process -FilePath ".\dist\excel-validator-gui.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: excel-validator-windows
          path: |
            dist/excel-validator-cli.exe
            dist/excel-validator-gui.exe
          if-no-files-found: error
          retention-days: 14
