name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name excel-validator src/validate_excel.py
      - uses: actions/upload-artifact@v4
        with:
          name: excel-validator-windows
          path: dist/excel-validator.exe
