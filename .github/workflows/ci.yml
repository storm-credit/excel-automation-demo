name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile src/validate_excel.py src/gui.py scripts/performance_smoke.py
      - name: Golden Case tests
        run: pytest -q
      - name: 10k row performance smoke
        run: python scripts/performance_smoke.py --rows 10000 --max-seconds 20
